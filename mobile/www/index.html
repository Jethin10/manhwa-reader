<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b17" />
    <title>Kairo</title>
    <script src="config.js"></script>
    <style>
      /* Mona Sans (SIL Open Font License), bundled so this screen looks right offline. */
      @font-face {
        font-family: "Mona Sans";
        src: url("mona-sans.woff2") format("woff2");
        font-weight: 200 900;
        font-stretch: 75% 125%;
        font-display: swap;
      }
      :root {
        --ink: #0a0b17;
        --dusk: #14162a;
        --slate: #1f2240;
        --paper: #eeecf4;
        --haze: #9497b4;
        --faint: #5f6282;
        --lamp: #f2c14e;
        --line: rgba(140, 146, 210, 0.16);
        --top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
        --bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
      }
      * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; background: var(--ink); color: var(--paper); }
      body {
        font: 16px/1.45 "Mona Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; justify-content: center;
        padding: calc(var(--top) + 24px) 24px calc(var(--bottom) + 24px);
        background: radial-gradient(120% 70% at 50% 0%, #1a1c36 0%, var(--ink) 60%);
      }
      main { width: 100%; max-width: 400px; margin: 0 auto; }
      .brand { display: flex; align-items: center; gap: 12px; }
      .mark { width: 30px; height: auto; color: var(--lamp); flex: none; }
      .wordmark { font-size: 30px; line-height: 1; font-weight: 700; font-stretch: 118%; letter-spacing: -0.045em; }
      .lede { color: var(--haze); font-size: 15px; line-height: 22px; margin-top: 14px; max-width: 30ch; }
      form { margin-top: 36px; }
      label { display: block; font-size: 13px; font-weight: 600; color: var(--haze); margin-bottom: 8px; }
      input {
        width: 100%; height: 52px; border: 0; border-radius: 8px; padding: 0 16px;
        background: var(--dusk); color: var(--paper); font: inherit; font-size: 16px; outline: none;
        box-shadow: inset 0 0 0 1px var(--line);
        transition: box-shadow 0.2s;
      }
      input::placeholder { color: var(--faint); }
      input:focus { box-shadow: inset 0 0 0 1.5px var(--lamp); }
      button {
        width: 100%; height: 52px; margin-top: 14px; border: 0; border-radius: 8px;
        background: var(--paper); color: var(--ink); font: 600 16px/1 "Mona Sans", system-ui, sans-serif;
        letter-spacing: -0.01em; transition: transform 0.2s, opacity 0.2s, background-color 0.2s;
      }
      button:active { transform: scale(0.98); opacity: 0.88; }
      button:disabled { opacity: 0.5; }
      button.secondary { background: var(--dusk); color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
      .hint { font-size: 13px; line-height: 19px; color: var(--faint); margin-top: 18px; }
      .error { color: #ff8a7a; min-height: 19px; font-size: 13px; line-height: 19px; margin-top: 12px; }
      code { color: var(--haze); font-family: inherit; font-weight: 600; }

      /* Launching: the mark and wordmark, with a lamp-gold line drawing underneath. */
      .launch {
        position: fixed; inset: 0; display: none; place-items: center;
        background: radial-gradient(120% 70% at 50% 0%, #1a1c36 0%, var(--ink) 60%);
      }
      .busy main { visibility: hidden; }
      .busy .launch { display: grid; }
      .launch .brand { flex-direction: column; gap: 18px; }
      .launch .mark { width: 44px; animation: glow 1.8s ease-in-out infinite; }
      .launch .wordmark { font-size: 26px; }
      .track { width: 120px; height: 2px; border-radius: 2px; background: var(--slate); overflow: hidden; }
      .track span { display: block; width: 40%; height: 100%; border-radius: inherit; background: var(--lamp); animation: draw 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes draw { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(242, 193, 78, 0)); }
        50% { filter: drop-shadow(0 0 14px rgba(242, 193, 78, 0.45)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch .mark, .track span { animation: none; }
        .track span { width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div class="launch" aria-hidden="true">
      <div class="brand">
        <svg class="mark" viewBox="6.5 4.5 20.5 23" fill="currentColor"><rect x="7" y="5" width="5" height="22" rx="1.2"/><path d="M13.4 17.2 L26.5 5 C21.4 10.6 20.6 19.4 23.6 27 Z"/></svg>
        <span class="wordmark">Kairo</span>
        <div class="track"><span></span></div>
      </div>
    </div>
    <main>
      <div class="brand">
        <svg class="mark" viewBox="6.5 4.5 20.5 23" fill="currentColor" aria-hidden="true"><rect x="7" y="5" width="5" height="22" rx="1.2"/><path d="M13.4 17.2 L26.5 5 C21.4 10.6 20.6 19.4 23.6 27 Z"/></svg>
        <h1 class="wordmark">Kairo</h1>
      </div>
      <p class="lede">Connect to your Kairo server to watch and read.</p>
      <form id="form">
        <label for="url">Server address</label>
        <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" autocorrect="off"
          spellcheck="false" placeholder="https://kairo-reader.vercel.app" required />
        <button id="go" type="submit">Connect</button>
        <div class="error" id="error" role="alert"></div>
        <button id="offline" type="button" class="secondary" hidden>Open downloads</button>
        <p class="hint">Use your Kairo web address, or run <code>npm run start:lan</code> on your
          computer and enter the address it prints (same Wi-Fi).</p>
      </form>
    </main>
    <script>
      const KEY = "manhwa:server";
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const clean = (v) => {
        v = (v || "").trim().replace(/\/+$/, "");
        if (v && !/^https?:\/\//i.test(v)) v = "http://" + v;
        return v;
      };

      // Any response, even an error status, proves the server is reachable.
      async function reachable(url) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 6000);
        try {
          await fetch(url + "/manifest.webmanifest", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(t);
        }
      }

      async function connect(url, auto) {
        $("error").textContent = "";
        $("go").disabled = true;
        document.body.classList.add("busy");
        if (await reachable(url)) {
          localStorage.setItem(KEY, url);
          location.replace(url + "/");
          return;
        }
        document.body.classList.remove("busy");
        $("go").disabled = false;
        // Downloaded chapters still open offline: the app's service worker serves them.
        $("offline").hidden = !localStorage.getItem(KEY);
        $("error").textContent = auto
          ? "Couldn't reach your server. Check your connection or that the server is running, then connect again."
          : "No Kairo server answered at that address. Check it and try again.";
      }

      $("offline").addEventListener("click", () => {
        location.replace(clean(localStorage.getItem(KEY)) + "/downloads");
      });
      const saved = clean(localStorage.getItem(KEY) || window.MANHWA_SERVER);
      $("url").value = saved;
      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const url = clean($("url").value);
        if (url) connect(url, false);
      });
      // "?change" comes from Settings in the app, to pick a different server.
      if (saved && !params.has("change")) connect(saved, true);
    </script>
  </body>
</html>
