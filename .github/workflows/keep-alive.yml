# Pings the Render app so the free plan doesn't put it to sleep after 15 idle minutes.
# GitHub may delay scheduled runs, so an UptimeRobot monitor on /api/health is the
# more reliable option; this is the backup that needs no account.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 -m 90 https://manhwa-reader-51fe.onrender.com/api/health
