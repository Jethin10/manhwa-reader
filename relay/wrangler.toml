# Cloudflare Worker that fetches upstream files for the app from Cloudflare's network.
# Deploy: cd relay && npx wrangler deploy; set the key once with `npx wrangler secret put RELAY_KEY`.
name = "manhwa-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Viewer reports about which copy each movie source plays (camera recording or real release).
[[kv_namespaces]]
binding = "COPIES"
id = "6e74db80f0bb4298a6e860e47c7c9f08"
